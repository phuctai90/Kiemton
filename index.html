<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kiểm tồn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13804a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kiểm tồn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin:0; height:100%; background:#eaf6ee; font:15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#1d2b22; }
  body { padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  #app { position:fixed; left:0; right:0; bottom:0; top:env(safe-area-inset-top); width:100%; height:calc(100% - env(safe-area-inset-top)); border:0; display:block; background:#eaf6ee; }
  #man { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; background:#eaf6ee; z-index:2; }
  #man img { width:96px; height:96px; border-radius:22px; }
  #man b { color:#13804a; font-size:18px; }
  #man .nho { font-size:13px; color:#5a6b60; max-width:320px; }
  .xoay { width:28px; height:28px; border:3px solid #cfe5d6; border-top-color:#13804a; border-radius:50%; animation:x 0.9s linear infinite; }
  @keyframes x { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .xoay { animation:none; } }
  button { padding:10px 18px; border:0; border-radius:8px; background:#13804a; color:#fff; font-size:15px; font-weight:600; }
</style>
</head>
<body>
<div id="man">
  <img src="icon-192.png" alt="">
  <b>Kiểm tồn cửa hàng</b>
  <div class="xoay" id="xoay"></div>
  <div class="nho" id="tb">Đang mở app…</div>
</div>
<iframe id="app" title="Kiểm tồn cửa hàng" allow="camera; clipboard-write" hidden></iframe>
<script>
  // ===== DÁN LINK WEBAPP APPS SCRIPT (kết thúc bằng /exec) VÀO GIỮA HAI DẤU NHÁY =====
  const APP_URL = 'https://script.google.com/macros/s/AKfycbw9VUNYiD5XAHs1d384y1un8CPYlfSx9teAY7z9rLGiQcKoGQweWq4-zEkhJTENdAsG/exec';
  // ===================================================================================
  const man = document.getElementById('man'), tb = document.getElementById('tb'), fr = document.getElementById('app');
  // Nhớ đăng nhập: vỏ app lưu phiên do webapp gửi ra, lần sau gửi kèm khi mở → vào thẳng, không phải đăng nhập lại
  const doc = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  addEventListener('message', e => {
    let host = ''; try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/(^|\.)googleusercontent\.com$|^script\.google\.com$/.test(host) || !e.data || !('kt_tok' in e.data)) return; // chỉ nhận từ webapp Apps Script
    try { e.data.kt_tok ? localStorage.setItem('kt_tok', e.data.kt_tok) : localStorage.removeItem('kt_tok'); } catch (x) {}
  });
  function moApp() {
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP_URL)) {
      document.getElementById('xoay').hidden = true;
      tb.textContent = 'Chưa gắn link webapp. Mở file index.html, dán link Apps Script (kết thúc bằng /exec) vào dòng APP_URL.';
      return;
    }
    if (!navigator.onLine) {
      document.getElementById('xoay').hidden = true;
      tb.innerHTML = 'Không có mạng. App cần Internet để đọc/ghi Google Sheet.<br><br><button onclick="location.reload()">Thử lại</button>';
      return;
    }
    const t = doc('kt_tok');
    fr.hidden = false; fr.src = APP_URL + (t ? (APP_URL.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(t) : '');
    fr.onload = () => { man.style.display = 'none'; };
    setTimeout(() => { if (man.style.display !== 'none') tb.textContent = 'Mạng chậm, vẫn đang mở…'; }, 8000);
  }
  addEventListener('online', () => { if (fr.hidden) location.reload(); });
  moApp();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
